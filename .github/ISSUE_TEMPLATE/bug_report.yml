name: 问题反馈
description: 报告安装、识别、界面或翻译问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        先查看[安装与常见问题](https://github.com/piaobo2233/deadlock-translator/blob/main/docs/guides/首版测试与分享.md)。
        请勿上传 API Key、完整 data 或私人聊天；截图遮挡昵称，日志先检查。安全漏洞请使用仓库 Security 页的私密报告。
  - type: input
    id: version
    attributes:
      label: 助手版本与运行方式
      placeholder: 例如 1.0.0-test.3，Windows ZIP / 源码
    validations:
      required: true
  - type: input
    id: display
    attributes:
      label: Windows、分辨率、缩放和游戏显示模式
      placeholder: 例如 Windows 11，2560×1440，125%，无边框
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 现象与复现步骤
      description: 写清预期、实际结果、操作步骤与出现频率。
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 已检查的诊断或必要日志（可选）
      description: 设置页可导出反馈 ZIP，请先本机检查。也可粘贴 --check 或 run.log 的必要部分，去掉昵称、路径等个人信息；不要上传完整 data。
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前检查
      options:
        - label: 我已检查内容，没有真实密钥、私人聊天或完整 data。
          required: true
